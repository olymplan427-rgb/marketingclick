name = "mtt-monitor-tracker"
main = "src/index.js"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "mtt-monitor-tracker"
database_id = "2f0b92be-0fc5-4cd0-96d4-5cce959ca760"

[vars]
# naver-cafe-keyword-monitor 레포를 그대로 사용 — Gemini/Claude API 키가 이미 이 레포 Secrets에 등록되어 있어
# marketingtool 쪽에 새로 키를 등록할 필요가 없음 (2026-08-31)
GITHUB_OWNER = "Olympiadedu"
GITHUB_REPO = "naver-cafe-keyword-monitor"

# 시크릿(코드에 넣지 말 것, wrangler secret put --name mtt-monitor-tracker 로 등록):
#   SHARED_TOKEN     - 프론트엔드 인증 토큰 (다른 mtt-*-tracker와 동일 패턴)
#   GITHUB_TOKEN     - marketingtool repo에 workflow 실행 권한이 있는 PAT
#   CALLBACK_SECRET  - GitHub Actions -> 이 Worker 콜백 인증용 공유 비밀
# vars(공개 가능, 필요시 [vars] 섹션으로 추가):
#   GITHUB_OWNER = "olymplan427-rgb"
#   GITHUB_REPO = "marketingtool"
