name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, beta ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev (main) → root
        uses: actions/checkout@v4
        with:
          ref: main
          path: dev-src

      - name: Checkout beta → /beta 하위경로
        uses: actions/checkout@v4
        with:
          ref: beta
          path: beta-src

      - name: Create config.js (dev + beta 공통 — Worker/카카오 키)
        env:
          BLOG_WORKER_URL: ${{ secrets.BLOG_WORKER_URL }}
          BLOG_WORKER_TOKEN: ${{ secrets.BLOG_WORKER_TOKEN }}
          MAPSEARCH_WORKER_URL: ${{ secrets.MAPSEARCH_WORKER_URL }}
          MAPSEARCH_WORKER_TOKEN: ${{ secrets.MAPSEARCH_WORKER_TOKEN }}
          NEWS_WORKER_URL: ${{ secrets.NEWS_WORKER_URL }}
          NEWS_WORKER_TOKEN: ${{ secrets.NEWS_WORKER_TOKEN }}
          KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
        run: |
          for dir in dev-src beta-src; do
            printf 'var ADMIN_GAS = { url: "%s", token: "%s" };\nvar ADMIN_GAS_MAPSEARCH = { url: "%s", token: "%s" };\nvar ADMIN_GAS_NEWS = { url: "%s", token: "%s" };\nvar ADMIN_KAKAO_KEY = "%s";\n' \
              "${BLOG_WORKER_URL}" "${BLOG_WORKER_TOKEN}" "${MAPSEARCH_WORKER_URL}" "${MAPSEARCH_WORKER_TOKEN}" "${NEWS_WORKER_URL}" "${NEWS_WORKER_TOKEN}" "${KAKAO_KEY}" > "$dir/config.js"
          done

      - name: Create flags.js (dev — 기본값 그대로, 전부 켜짐)
        run: |
          printf 'window.SITE_ID = "dev"; // 로그인 저장소를 beta와 분리하는 용도\n// dev 사이트: 기능 제한 없음\n' > dev-src/js/flags.js

      - name: Create flags.js (beta — BETA_DISABLED_FEATURES 변수 반영)
        env:
          DISABLED: ${{ vars.BETA_DISABLED_FEATURES }}
        run: |
          node -e "
            const disabled = (process.env.DISABLED || '').split(',').map(s => s.trim()).filter(Boolean);
            const overrides = {};
            disabled.forEach(f => { overrides[f] = false; });
            console.log('window.SITE_ID = \"beta\"; // 로그인 저장소를 dev와 분리하는 용도');
            console.log('// beta 사이트: BETA_DISABLED_FEATURES 저장소 변수로 제어');
            console.log('window.FEATURE_FLAGS = Object.assign(window.FEATURE_FLAGS || {}, ' + JSON.stringify(overrides) + ');');
          " > beta-src/js/flags.js
          echo "=== beta-src/js/flags.js ==="
          cat beta-src/js/flags.js

      - name: Cache-bust local assets (커밋 해시를 쿼리스트링으로 붙여 배포 후 캐시 문제 방지)
        run: |
          node dev-src/.github/scripts/cachebust.js dev-src
          node beta-src/.github/scripts/cachebust.js beta-src

      - name: Assemble combined site (dev=루트, beta=/beta)
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' dev-src/ _site/
          mkdir -p _site/beta
          rsync -a --exclude='.git' beta-src/ _site/beta/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
