<div class="main" id="main-container">

<!-- 로그인 게이트 — 로그인 전에는 전체를 가림 (js/common.js의 initLoginGate가 로그인 여부에 따라 표시/숨김) -->
<div id="login-overlay" style="display:flex;position:fixed;inset:0;z-index:3000;background:var(--bg);align-items:center;justify-content:center;">
  <div style="background:var(--sur);border:1px solid var(--bdr);border-radius:12px;padding:32px;width:320px;max-width:90vw;">
    <div id="login-title" style="font-weight:900;font-size:18px;margin-bottom:4px;">MarketingTool 로그인</div>
    <div id="login-subtitle" style="color:var(--mut);font-size:13px;margin-bottom:20px;">원하는 아이디/비밀번호로 로그인하세요</div>
    <div id="login-register-fields" style="display:none;">
      <div class="set-field">
        <input id="login-reg-name" type="text" placeholder="이름" class="set-input" autocomplete="name" onkeydown="if(event.key==='Enter')registerSubmit()" />
      </div>
      <div class="set-field" style="margin-top:8px;">
        <input id="login-reg-academy" type="text" placeholder="학원명" class="set-input" autocomplete="organization" onkeydown="if(event.key==='Enter')registerSubmit()" />
      </div>
    </div>
    <div class="set-field">
      <input id="login-id" type="text" placeholder="아이디" class="set-input" autocomplete="username" onkeydown="if(event.key==='Enter')loginOverlaySubmit()" />
    </div>
    <div class="set-field" style="margin-top:8px;">
      <input id="login-pw" type="password" placeholder="비밀번호" class="set-input" autocomplete="current-password" onkeydown="if(event.key==='Enter')loginOverlaySubmit()" />
    </div>
    <div id="login-reg-pw-confirm-field" class="set-field" style="display:none;margin-top:8px;">
      <input id="login-reg-pw-confirm" type="password" placeholder="비밀번호 확인" class="set-input" autocomplete="new-password" onkeydown="if(event.key==='Enter')registerSubmit()" />
    </div>
    <div id="login-error" style="display:none;color:#ef4444;font-size:12px;margin-top:8px;"></div>
    <button id="login-submit" class="btn btn-primary" style="width:100%;margin-top:16px;" onclick="loginOverlaySubmit()">로그인</button>
    <div style="text-align:center;margin-top:14px;font-size:12px;color:var(--mut);">
      <span id="login-toggle-to-register">계정이 없으신가요? <a href="javascript:void(0)" onclick="setLoginOverlayMode('register')" style="color:var(--acc);font-weight:700;">회원가입</a></span>
      <span id="login-toggle-to-login" style="display:none;">이미 계정이 있으신가요? <a href="javascript:void(0)" onclick="setLoginOverlayMode('login')" style="color:var(--acc);font-weight:700;">로그인</a></span>
    </div>
  </div>
</div>

<div id="toast" style="display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;z-index:2000;pointer-events:none;"></div>

<!-- 1. 다른 스크립트보다 먼저 pages/*.html을 동기 로드해 DOM에 삽입 -->
<script>
(function() {
  var container = document.getElementById('main-container');
  var pages = ['pages/image.html', 'pages/blog.html', 'pages/monitor.html', 'pages/mapsearch.html', 'pages/report.html', 'pages/schoolshare.html', 'pages/feedback.html', 'pages/settings.html'];
  pages.forEach(function(url) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, false); // synchronous — 로컬 서버 전용
    xhr.send(null);
    if (xhr.status === 200) {
      container.insertAdjacentHTML('beforeend', xhr.responseText);
    } else {
      console.error('페이지 로드 실패:', url, xhr.status);
    }
  });
})();
</script>

<!-- 2. DOM이 준비된 후 각 모듈 스크립트 로드 -->
<!-- 기능별 on/off 기본값(전부 켜짐) — 배포 시 flags.js가 이 중 일부를 덮어씀. flags.js는 gitignore 대상이라 로컬엔 없어도(404) 정상 동작함 -->
<script>window.FEATURE_FLAGS = { monitor: true, instagram: true, mapsearch: true, schoolshare: true };</script>
