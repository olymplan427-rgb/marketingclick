
  <!-- PAGE FEEDBACK (사이드바 라벨: 문의) -->
  <div class="page" id="page-feedback">
    <div class="page-topbar"><div class="page-topbar-title">문의</div></div>

    <div id="fb-view-list">
      <div class="info-banner">
        <div class="info-banner-icon"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
        <div class="info-banner-body">
          <div class="info-banner-title">남기신 1:1 문의와 답변을 확인합니다.</div>
          <div class="info-banner-desc">본인 문의만 보입니다.</div>
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;padding:14px 24px 0;">
        <button class="btn btn-primary" onclick="feedbackShowWrite()">문의 작성하기</button>
      </div>
      <div id="fb-list" style="padding:14px 24px 24px;"></div>
    </div>

    <div id="fb-view-write" style="display:none;">
      <div class="info-banner">
        <div class="info-banner-icon"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
        <div class="info-banner-body">
          <div class="info-banner-title">문의 분류를 고르고 제목과 내용을 남겨 주세요.</div>
          <div class="info-banner-desc">로그인 계정으로 접수되어 별도 연락처 입력은 필요하지 않습니다.</div>
        </div>
      </div>
      <div style="padding:14px 24px 24px;max-width:820px;margin:0 auto;">
        <div style="display:flex;gap:16px;margin-bottom:14px;flex-wrap:wrap;">
          <div style="flex:1;min-width:200px;">
            <div class="sec-title">문의 분류</div>
            <select class="blog-input" id="fb-category" onchange="feedbackUpdateSubcategories()"></select>
          </div>
          <div style="flex:1;min-width:200px;">
            <div class="sec-title">세부 항목</div>
            <select class="blog-input" id="fb-subcategory"></select>
          </div>
        </div>
        <div class="sec-title">제목</div>
        <input class="blog-input" id="fb-title" placeholder="문의 제목을 입력해 주세요." style="margin-bottom:14px;">
        <div class="sec-title">내용</div>
        <textarea class="blog-input" id="fb-new-content" rows="8" placeholder="문의하실 내용을 입력해 주세요." maxlength="4000" oninput="feedbackUpdateCount()" style="min-height:160px;"></textarea>
        <div style="text-align:right;font-size:12px;color:var(--mut);margin:4px 0 14px;" id="fb-count">0/4000</div>
        <div id="fb-alert" class="blog-alert err"></div>
        <div style="display:flex;justify-content:flex-end;gap:8px;">
          <button class="btn btn-outline" onclick="feedbackShowList()">취소</button>
          <button class="btn btn-primary" onclick="feedbackPost()">문의 접수</button>
        </div>
      </div>
    </div>
  </div><!-- /page-feedback -->
