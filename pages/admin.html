
  <!-- PAGE ADMIN — role==='관리자'인 계정에만 사이드바 노출(applyAdminVisibility), 서버도 별도로 역할 검증함 -->
  <div class="page" id="page-admin">
    <div class="page-topbar"><div class="page-topbar-title">관리자</div></div>
    <div class="info-banner">
      <div class="info-banner-icon"><svg viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/></svg></div>
      <div class="info-banner-body">
        <div class="info-banner-title">AI 설정 · 크레딧 비용 · 사용자를 관리합니다 (D1 즉시 반영, 코드 재배포 불필요)</div>
      </div>
    </div>

    <div class="credit-content">
      <div class="tool-section">
        <div class="sec-title">공지사항 (홈 화면에 표시)</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;">
          <input class="blog-input" type="date" id="admin-notice-date" style="width:160px;">
          <input class="blog-input" id="admin-notice-title" placeholder="제목" style="flex:1;min-width:200px;">
          <button class="btn btn-primary" onclick="adminAddNotice()">공지 등록</button>
        </div>
        <textarea class="blog-input" id="admin-notice-body" rows="2" placeholder="내용" style="width:100%;margin-bottom:14px;"></textarea>
        <div id="admin-notice-list" style="display:flex;flex-direction:column;gap:8px;"></div>
      </div>

      <div class="tool-section">
        <div class="sec-title">AI 프로바이더 설정</div>
        <div id="admin-ai-list" style="display:flex;flex-direction:column;gap:12px;"></div>
      </div>

      <div class="tool-section">
        <div class="sec-title">기능별 크레딧 비용</div>
        <div style="overflow-x:auto;">
          <table style="width:100%;border-collapse:collapse;font-size:13px;">
            <thead>
              <tr style="border-bottom:1px solid var(--bdr);color:var(--mut);text-align:left;">
                <th style="padding:10px;">기능</th>
                <th style="padding:10px;width:140px;">크레딧 비용</th>
                <th style="padding:10px;width:80px;"></th>
              </tr>
            </thead>
            <tbody id="admin-credit-cost-body"></tbody>
          </table>
        </div>
      </div>

      <div class="tool-section">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <div class="sec-title" style="margin:0;">사용자 관리</div>
          <span id="admin-pending-banner" class="info-banner-badge" style="background:var(--acc);color:#fff;display:none;"></span>
        </div>
        <div style="overflow-x:auto;">
          <table style="width:100%;border-collapse:collapse;font-size:13px;">
            <thead>
              <tr style="border-bottom:1px solid var(--bdr);color:var(--mut);text-align:left;">
                <th style="padding:10px;">아이디</th>
                <th style="padding:10px;">이름 / 학원</th>
                <th style="padding:10px;width:110px;">상태</th>
                <th style="padding:10px;width:110px;">역할</th>
                <th style="padding:10px;width:110px;">월크레딧</th>
                <th style="padding:10px;width:110px;">잔여크레딧</th>
                <th style="padding:10px;width:140px;"></th>
              </tr>
            </thead>
            <tbody id="admin-user-body"></tbody>
          </table>
        </div>
      </div>

      <div class="tool-section">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <div class="sec-title" style="margin:0;">블로그 글 관리 (전체 사용자)</div>
          <input class="blog-input" id="admin-post-filter" placeholder="아이디·제목으로 검색" style="width:240px;" oninput="adminRenderPosts()">
        </div>
        <div id="admin-validation-summary" style="margin-bottom:12px;"></div>
        <div id="admin-post-pv-filter-banner"></div>
        <div style="overflow-x:auto;">
          <table style="width:100%;border-collapse:collapse;font-size:13px;">
            <thead>
              <tr style="border-bottom:1px solid var(--bdr);color:var(--mut);text-align:left;">
                <th style="padding:10px;width:100px;">작성자</th>
                <th style="padding:10px;width:100px;">날짜</th>
                <th style="padding:10px;">제목</th>
                <th style="padding:10px;width:90px;">유형</th>
                <th style="padding:10px;width:130px;">프롬프트버전</th>
                <th style="padding:10px;width:100px;">검증</th>
                <th style="padding:10px;width:140px;"></th>
              </tr>
            </thead>
            <tbody id="admin-post-body"></tbody>
          </table>
        </div>
      </div>

      <div id="admin-alert" class="blog-alert err"></div>
    </div>

    <!-- 글 본문 팝업 (ms-modal 패턴 재사용) -->
    <div class="ms-modal-overlay" id="admin-post-modal" style="display:none;" onclick="if(event.target===this) adminCloseModal()">
      <div class="ms-modal-box">
        <div class="ms-modal-header">
          <div class="ms-modal-title" id="admin-post-modal-title"></div>
          <button class="ms-modal-close" onclick="adminCloseModal()">✕</button>
        </div>
        <div class="ms-modal-body" id="admin-post-modal-body"></div>
      </div>
    </div>
  </div><!-- /page-admin -->
