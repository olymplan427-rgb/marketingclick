
  <!-- PAGE SCHOOLSHARE -->
  <div class="page" id="page-schoolshare">
    <div class="page-topbar"><div class="page-topbar-title">학교 점유율</div></div>
    <div class="info-banner">
      <div class="info-banner-icon"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg></div>
      <div class="info-banner-body">
        <div class="info-banner-title">인근 학교 대비 우리 학원 재원생 비율을 확인하세요</div>
        <div class="info-banner-desc">학교별 전체 학생 수 대비 우리 학원 재원생 비율을 비교·추적합니다</div>
      </div>
      <div class="info-banner-badges">
        <span class="info-banner-badge">학교알리미 연동</span>
      </div>
    </div>

    <div class="page-row">
      <div class="blog-left">
        <div class="tool-section">
          <div class="sec-title">학교 검색</div>
          <select class="blog-input" id="ss-sido-select" onchange="ssOnSidoChange()">
            <option value="">시/도 선택</option>
          </select>
          <select class="blog-input" id="ss-sgg-select">
            <option value="">시군구 선택</option>
          </select>
          <select class="blog-input" id="ss-kind-select">
            <option value="02">초등학교</option>
            <option value="03">중학교</option>
            <option value="04">고등학교</option>
          </select>
          <button class="btn btn-primary" style="width:100%;" onclick="ssSearchSchool()">검색</button>
        </div>

        <div id="ss-search-results" style="display:none;"></div>
      </div>

      <div class="canvas-right" style="overflow-y:auto;align-items:stretch;justify-content:flex-start;">
        <div class="canvas-header">
          <div class="canvas-header-left">
            <div class="canvas-title">내 학교 목록</div>
            <div class="canvas-desc" id="ss-tab-desc">왼쪽에서 학교를 검색해 추가한 뒤 점유율을 비교하세요</div>
          </div>
          <div style="display:flex; gap:8px;">
            <div class="mon-pill active-date" id="ss-tab-btn-compare" onclick="ssShowTab('compare')">비교</div>
            <div class="mon-pill" id="ss-tab-btn-trend" onclick="ssShowTab('trend')">월별추이</div>
            <div class="mon-pill" id="ss-tab-btn-monthly" onclick="ssShowTab('monthly')">재원생입력</div>
          </div>
        </div>

        <div style="padding:20px 24px;" id="ss-compare-view">
          <div id="ss-schools-container">
            <div class="empty-state">
              <div class="empty-state-title">아직 추가한 학교가 없습니다</div>
              <div class="empty-state-desc">왼쪽에서 학교를 검색해 추가해보세요</div>
            </div>
          </div>
        </div>

        <div style="padding:20px 24px; display:none;" id="ss-monthly-view">
          <div id="ss-monthly-container"></div>
        </div>

        <div style="padding:20px 24px; display:none;" id="ss-trend-view">
          <div id="ss-trend-container"></div>
        </div>
      </div>
    </div>
  </div><!-- /page-schoolshare -->
