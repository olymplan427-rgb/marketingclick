
  <!-- PAGE MAPSEARCH -->
  <div class="page" id="page-mapsearch">
    <div class="page-topbar"><div class="page-topbar-title">주변 학원 검색</div></div>
    <div class="info-banner">
      <div class="info-banner-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="10" r="3"/><path d="M12 21s-7-5.686-7-11a7 7 0 0 1 14 0c0 5.314-7 11-7 11z"/></svg></div>
      <div class="info-banner-body">
        <div class="info-banner-title">우리 학원 위치 기준으로 반경 내 수학학원을 찾아드려요</div>
        <div class="info-banner-desc">주변 학원의 블로그·카페 글을 함께 취합해 보여드립니다</div>
      </div>
    </div>

    <div class="page-row">
      <div class="blog-left">
        <div class="tool-section">
          <div class="sec-title">① 기준 위치</div>
          <select class="blog-input" id="ms-profile-select" onchange="msOnProfileChange()"></select>
          <div class="hint-text" id="ms-profile-map-hint" style="margin-top:2px;"></div>
        </div>

        <div class="tool-section">
          <div class="sec-title">② 검색 반경</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;" id="ms-radius-group">
            <div class="mon-pill" data-r="500" onclick="msSetRadius(this,500)">500m</div>
            <div class="mon-pill active-date" data-r="1000" onclick="msSetRadius(this,1000)">1km</div>
            <div class="mon-pill" data-r="2000" onclick="msSetRadius(this,2000)">2km</div>
          </div>
        </div>

        <div class="tool-section">
          <div class="sec-title">③ 검색 키워드</div>
          <input class="blog-input" id="ms-keyword" value="수학학원" />
          <div class="hint-text">카카오맵 카테고리 "학원"과 함께 검색됩니다</div>
        </div>

        <button class="btn btn-primary" style="width:100%;" onclick="msSearch()">🔍 주변 학원 검색</button>
      </div>

      <div class="blog-right">
        <div class="blog-card">
          <div style="font-size:14px;font-weight:800;color:var(--txt);">인근 학원 리스트</div>
          <div style="font-size:12px;color:var(--mut);margin-top:4px;" id="ms-result-count">왼쪽에서 위치와 반경을 설정한 뒤 검색해보세요</div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start;" id="ms-result-list">
          <div class="empty-state" style="grid-column:1/-1;">
            <div class="empty-state-title">검색 결과가 여기에 표시됩니다</div>
            <div class="empty-state-desc">왼쪽에서 위치와 반경을 설정한 뒤 검색해보세요</div>
          </div>
        </div>
      </div>
    </div>

    <div class="ms-modal-overlay" id="ms-post-modal" style="display:none;" onclick="if(event.target===this) msCloseModal()">
      <div class="ms-modal-box">
        <div class="ms-modal-header">
          <div class="ms-modal-title" id="ms-modal-title"></div>
          <button class="ms-modal-close" onclick="msCloseModal()">✕</button>
        </div>
        <div class="ms-modal-body" id="ms-modal-body"></div>
      </div>
    </div>
  </div><!-- /page-mapsearch -->
